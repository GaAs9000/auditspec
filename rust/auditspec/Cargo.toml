[package]
name = "auditspec-cli"
version = "1.3.0"
edition = "2024"
rust-version = "1.85"
description = "Standalone AuditSpec evidence vault and audit-time verifier"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/GaAs9000/auditspec"
keywords = ["audit", "evidence", "verification", "ai-agents"]
categories = ["command-line-utilities", "cryptography"]

[lib]
name = "auditspec"
path = "src/lib.rs"

[[bin]]
name = "auditspec"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
clap = { version = "4.5.48", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "zeroize"] }
fs2 = "0.4.3"
hex = "0.4.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
regex = "1.12.2"
serde = "1.0.228"
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tempfile = "3.23.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
