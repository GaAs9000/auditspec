[build-system]
requires = ["setuptools==79.0.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "auditability-compiler"
version = "1.3.0"
description = "Compile and verify bounded AI-agent audit contracts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "AuditSpec contributors"}]
dependencies = ["PyYAML>=6.0", "cryptography==50.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8", "Automat==24.8.1"]
runtime = ["langgraph==1.2.9", "transitions==0.9.3"]
symbolic = ["z3-solver==5.0.0.0"]
all = ["pytest>=8.0", "matplotlib>=3.8", "Automat==24.8.1", "langgraph==1.2.9", "transitions==0.9.3", "z3-solver==5.0.0.0"]

[project.scripts]
auditctl = "auditspec.cli:main"
auditvault = "auditspec.core.vault_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditspec = ["data/*.json", "data/examples/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
