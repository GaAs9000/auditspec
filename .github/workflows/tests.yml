name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[all]'
      - run: python -m pip install -r verification/requirements-state-model.txt
      - run: python scripts/freeze_catalog.py
      - run: python scripts/run_public_ci.py
      - run: auditctl examples/payment.yaml summary
      - run: auditvault --help

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.85.0
      - run: cargo fmt --all --manifest-path rust/auditspec/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path rust/auditspec/Cargo.toml
      - run: >-
          cargo clippy --all-targets --locked
          --manifest-path rust/auditspec/Cargo.toml -- -D warnings
      - run: rust/auditspec/target/debug/auditspec --help

  wheel-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - run: python -m venv /tmp/auditspec-consumer
      - run: >-
          /tmp/auditspec-consumer/bin/pip install dist/*.whl
          langgraph==1.2.9 transitions==0.9.3
      - run: /tmp/auditspec-consumer/bin/auditctl examples/payment.yaml summary
      - run: /tmp/auditspec-consumer/bin/auditvault --help
      - run: >-
          /tmp/auditspec-consumer/bin/python -c
          "from auditspec.adapter_registry import registry_attestation_status;
          assert registry_attestation_status() == (True, ())"
      - run: >-
          /tmp/auditspec-consumer/bin/python -c
          "from auditspec.runtime.payment_graph import run_payment_fixture;
          from pathlib import Path;
          result, sink = run_payment_fixture({'run_id':'wheel-consumer'},
          db_path=Path('/tmp/auditspec-wheel-consumer.sqlite'),
          enabled_mechanisms={'canonical_action'});
          assert result['run_id'] == 'wheel-consumer' and len(sink.events) == 1"
