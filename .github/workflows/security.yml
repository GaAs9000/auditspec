name: security
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install pip-audit==2.10.1 build==1.6.0 twine==7.0.0
      - run: python -m pip_audit -r security/requirements-audit.txt
      - run: python -m build
      - run: python -m twine check dist/*
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: >-
          RUSTUP_TOOLCHAIN=1.89.0 cargo install cargo-audit
          --locked --version 0.22.2
      - run: >-
          RUSTUP_TOOLCHAIN=1.89.0 cargo audit
          --file rust/auditspec/Cargo.lock

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
